server:
  port: 8080

spring:
  application:
    name: auth-service
  liquibase:
    change-log: db/db.changelog-master.xml
  datasource:
    url: jdbc:postgresql://localhost:5432/app
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

    # Настройки пула соединений HikariCP
    hikari:
      pool-name: HikariPool-Postgres
      maximum-pool-size: 10          # Максимальное количество активных соединений
      minimum-idle: 2               # Минимальное количество спящих соединений
      idle-timeout: 600000          # Сколько соединение может спать перед удалением (10 мин)
      max-lifetime: 1800000         # Максимальный жизненный цикл соединения (30 мин)
      connection-timeout: 30000     # Время ожидания свободного соединения (30 сек)

  # Настройки Hibernate / JPA (если используются)
  jpa:
    properties:
      hibernate.default_schema: auth_service
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none              # Режим работы с таблицами (validate для продакшена!)
    show-sql: false                  # Показывать SQL-запросы в консоли

registration:
  jwt:
